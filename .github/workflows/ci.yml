---
# This workflow runs the repo's CI tests.
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: 5 4 * * 1  # every monday at 04:05 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Python ${{ matrix.python-version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    defaults:
      run:
        shell: bash -elo pipefail {0}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: pyproject.toml
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install OSMnx
        run: |
          uv python pin ${{ matrix.python-version }}
          uv sync --all-extras --group docs --group lint --group test

      # restore previous responses, using a new key for each run attempt
      - name: Restore OSMnx cache
        id: osmnx-cache
        uses: actions/cache/restore@v6
        with:
          path: tests/.cache
          key: osmnx-cache-${{ runner.os }}-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}  # yamllint disable-line rule:line-length
          restore-keys: osmnx-cache-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek/
          key: pre-commit-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit checks
        run: uv run prek run --all-files
        env:
          SKIP: no-commit-to-branch

      - name: Build and check package
        run: |
          uv build
          uv run twine check --strict dist/*

      - name: Test docs build
        run: uv run sphinx-build -E -W --keep-going -b html ./docs/source ./docs/build/html

      - name: Test code and coverage
        run: uv run ./tests/run_tests.sh --typeguard-packages=osmnx --cov=osmnx --cov-report=xml

      # save collected responses even if tests fail, for reuse on the next attempt
      - name: Save OSMnx cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: tests/.cache
          key: ${{ steps.osmnx-cache.outputs.cache-primary-key }}

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
